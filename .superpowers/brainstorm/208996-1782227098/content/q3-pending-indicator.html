<h2>변경 중인 내용 표시 방식</h2>
<p class="subtitle">저장 전 pending 상태를 사용자에게 어떻게 보여줄까요?</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>변경된 행 하이라이트</h3>
      <p>수정된 행의 배경을 연한 노란색/파란색으로 표시</p>
      <p>상단 툴바에 "3개 항목 변경됨 — 저장 | 취소" 표시</p>
      <div style="margin-top:12px;border:1px solid #e0e0e0;border-radius:6px;overflow:hidden;font-size:13px;">
        <div style="background:#fef9c3;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;">
          <span>alice</span><span style="color:#b45309">● 수정됨</span>
        </div>
        <div style="padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e0e0e0;">
          <span>bob</span><span style="color:#888">—</span>
        </div>
        <div style="background:#fef2f2;padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e0e0e0;">
          <span style="text-decoration:line-through;color:#aaa">carol</span><span style="color:#dc2626">● 제거 예정</span>
        </div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>상단 요약 배너만</h3>
      <p>행 색상 변경 없이 상단에만 변경 요약 표시</p>
      <p>"quota 2건 수정, 1명 제거 예정 — 저장 | 취소"</p>
      <div style="margin-top:12px;border-radius:6px;background:#eff6ff;border:1px solid #bfdbfe;padding:10px 14px;font-size:13px;display:flex;justify-content:space-between;align-items:center;">
        <span>📝 quota 2건 수정 · 1명 제거 예정</span>
        <span style="display:flex;gap:8px;">
          <button style="padding:4px 12px;background:#2563eb;color:white;border:none;border-radius:4px;cursor:pointer">저장</button>
          <button style="padding:4px 12px;background:white;border:1px solid #ccc;border-radius:4px;cursor:pointer">취소</button>
        </span>
      </div>
    </div>
  </div>
</div>
