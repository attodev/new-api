<h2>Owner 사용자 보호 범위</h2>
<p class="subtitle">조직 owner는 제거·비활성화 대상에서 어떻게 처리할까요?</p>

<div class="options">
  <div class="option" data-choice="a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>체크박스 자체를 숨김</h3>
      <p>Owner 행에는 체크박스가 아예 표시되지 않아 선택 자체가 불가</p>
      <p>개별 상태 토글(활성/비활성)도 비활성화</p>
    </div>
  </div>
  <div class="option" data-choice="b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>체크박스 표시하되 비활성화</h3>
      <p>Owner 행의 체크박스는 보이지만 클릭 불가 (회색 처리)</p>
      <p>개별 상태 토글도 비활성화, 호버 시 "Owner는 변경 불가" 툴팁</p>
    </div>
  </div>
</div>
