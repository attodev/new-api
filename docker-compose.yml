# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api # ⚠️ IMPORTANT: Change the password in production!
#      - SQL_DSN=root:123456@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - CRYPTO_SECRET=replace_with_a_persistent_random_value  # Fresh installs: stable 32+ byte key shared by every node. Existing SESSION_SECRET-encrypted installs must keep CRYPTO_SECRET unset or initially set it to that exact 32+ byte SESSION_SECRET; shorter/changed keys require an explicit decrypt-and-re-encrypt migration and must be backed up with the DB.
#      - TOSS_OPTION_SECRET_ENCRYPTION_ENABLED=false  # Freeze Toss config writes, upgrade every node with the same existing encryption key, then enable everywhere to migrate Toss secrets to enc:v1; do not rotate keys/test mode during the mixed-version window.
#      Toss config attestation rollout: disable every Toss payment mode and drain old API/workers; after replacing all nodes, submit all 14 Toss options once through the new bulk endpoint while disabled, then re-enable. Revision-less/partial legacy writes remain quarantined. Every node must share the same persistent 32+ byte CRYPTO_SECRET (or existing SESSION_SECRET).
#      - NODE_TYPE=slave  # Slaves skip DB migrations; start/finish the master migration before bringing new slave nodes or Toss payment traffic online.
#      - TOSS_PAYMENT_KEY_SCOPED_IDEMPOTENCY_ENABLED=true  # Secure default. Use explicit false only while checkout is paused for a mixed-version rollout; drain/reconcile v0, then remove the override or set true before resuming.
#      Toss recurring-attempt upgrade: persist both DB recurring options explicitly false, stop every old master/scheduler and billing callback route, wait at least 5 minutes, and do not rotate MID/keys/test mode or change process TZ; every master must use the existing worker TZ. Only after that drain, set TOSS_RECURRING_PROTOCOL_MIGRATION_DRAINED=true temporarily on the sole migration master; this acknowledgement also activates opaque orderId v2 immediately after legacy schema migration, while missing/enabled/invalid DB options still block activation. Remove the env immediately after success, never restart an old binary, replace every node, reconcile pending attempts, then re-enable TossBillingEnabled and only afterwards explicitly enable TossWalletAutoRechargeEnabled. Old wallet workers do not understand the new gate. Fresh databases start on v2.
#      - TOSS_RECURRING_PROTOCOL_MIGRATION_DRAINED=false  # One-shot legacy-schema drain acknowledgement; set true only on the drained sole migration master, then remove immediately.
#      - TOSS_RECURRING_ORDER_ID_V2_ACTIVATION_DRAINED=false  # Existing Phase-A/v1 DB only: repeat the same drain with both DB options explicitly false, set true on the sole migration master, then remove immediately.
#      Outbound firewall: allow every current api.tosspayments.com IP: 103.182.251.2, 103.182.250.2, 210.98.141.21, 210.98.141.22, 164.124.119.201, 121.67.39.201, 18.98.133.64, 18.98.133.65 (last four added 2026-05). DNS targets can change; recheck https://docs.tosspayments.com/reference/using-api/security before deployment.
#      - TOSS_WEBHOOK_SOURCE_CIDRS=  # Optional extra Toss inbound webhook IP/CIDR entries.
#      - TOSS_WEBHOOK_TRUSTED_PROXY_CIDRS=  # Required behind a proxy: only listed peers may supply X-Forwarded-For for Toss webhooks.
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - new-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  pg_data:
#  mysql_data:

networks:
  new-api-network:
    driver: bridge
